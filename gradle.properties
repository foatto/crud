group=foatto

#--- gradle options ---

org.gradle.java.home=/home/foatto/jdk-17
org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx8g"
# замедляет сборку, но гредловский демон перестаёт жрать память как не в себя
org.gradle.daemon=false
org.gradle.parallel=true

#--- enabled debug-mode (+ println to browser console)

development=true

#--- kotlin options ---

kotlin.code.style=official

#--- kotlin task options ---

isBuildSupressWarning=true
kotlinLanguageVersion=1.9
kotlinApiVersion=1.9
kotlinJvmTarget=17

#--- common versions (libs & plugins) ---

kotlinVersion=1.9.24
springBootVersion=3.3.3

#--- MPP options

kotlin.mpp.androidSourceSetLayoutVersion=2

#--- kotlin/js options

kotlin.js.compiler=ir
kotlin.incremental.js.ir=false
kotlin.js.ir.output.granularity=whole-program

#--- plugin versions ---

# 8.2.x и 8.3.1 - пока несовместимо с устаревшим adnroid-плагином в моей старой IDEA
# (но gradlew-сборка с 8.3.1 проходит нормально)
#agpVersion=8.5.0
agpVersion=8.1.0
springDependencyManagementPluginVersion=1.1.6

#--- отдельно пачка Compose-версий

composeCompilerVersion=1.5.14
composeRuntimeVersion=1.6.7
composePluginVersion=1.6.10

# для использования wasm через wasmJsMain
org.jetbrains.compose.experimental.wasm.enabled=true
# для использования wasm через jsMain
#org.jetbrains.compose.experimental.uikit.enabled=true
#org.jetbrains.compose.experimental.jscanvas.enabled=true

androidx.compose.compiler.plugins.kotlin.generateDecoys=true

#--- Android

android.useAndroidX=true
android.nonTransitiveRClass=true

androidCompileSdk=34
androidTargetSdk=34
androidMinSdk=28

