kotlinxCoroutinesVersion=1.8.0
kotlinxDatetimeVersion=0.6.0
kotlinxSerializationVersion=1.6.3
#3.0.0-beta-1 - всё ещё нет подходящей версии для wasm в mpp-compose-1.6.x
ktorVersion=3.0.0-beta-1
